# Publishes Lanternreach to GitHub Pages. lanternreach.html has no page skeleton
# (the artifact host adds one), so wrap it here the same way lanternreach.sh does.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r fonts icon.svg manifest.webmanifest _site/
          {
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' \
              '<meta name="theme-color" content="#060911"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lanternreach"><link rel="manifest" href="manifest.webmanifest">' \
              '<link rel="icon" href="icon.svg" type="image/svg+xml">' \
              '<link rel="stylesheet" href="fonts/fonts.css"><style>[hidden]{display:none!important}</style></head><body>'
            cat lanternreach.html
            printf '%s\n' '</body></html>'
          } > _site/index.html
          {
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' \
              '<link rel="icon" href="icon.svg" type="image/svg+xml"><style>[hidden]{display:none!important}</style></head><body>'
            cat lanternreach-radio.html
            printf '%s\n' '</body></html>'
          } > _site/radio.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
